services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: squash_league
      POSTGRES_USER: squash
      POSTGRES_PASSWORD: squash_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squash -d squash_league"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
